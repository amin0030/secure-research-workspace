
services:
  booking_service:
    build:
      context: ./services/booking_service
    env_file:
      - .env.booking.local
    environment:
      BOOKING_DB_PATH: /data/booking.sqlite3
    volumes:
      - booking_data:/data
    restart: unless-stopped

  confirmation_service:
    build:
      context: .
      dockerfile: services/confirmation_service/Dockerfile
    env_file:
      - .env.confirmation.local
    environment:
      BOOKING_SERVICE_URL: http://booking_service:8001
    restart: unless-stopped

  app_api:
    build:
      context: ./services/app_api
    env_file:
      - .env.local
    environment:
      BOOKING_SERVICE_URL: http://booking_service:8001
      CONFIRMATION_SERVICE_URL: http://confirmation_service:8002
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      - booking_service
      - confirmation_service
    restart: unless-stopped

volumes:
  booking_data:
